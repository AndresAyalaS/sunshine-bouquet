server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # El navegador llama a /graphql en su mismo origen; nginx lo reenvía al Apollo Gateway.
  # Se resuelve con variable + resolver para que nginx arranque aunque el gateway tarde en estar listo.
  location /graphql {
    resolver 127.0.0.11 valid=10s;
    set $gateway http://gateway:4000;
    proxy_pass $gateway/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Archivos con hash: caché larga.
  location ~* \.(?:js|css|woff2?|ico|png|svg)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA: cualquier ruta cae en index.html (las rutas las resuelve Angular).
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
